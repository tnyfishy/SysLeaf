name: Android
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete 'tools' package is no longer in Google's repository.
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy,rustfmt
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sysleaf-android
          path: build/app/outputs/flutter-apk/app-release.apk
